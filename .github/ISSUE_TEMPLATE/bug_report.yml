name: Bug report
description: Meld een reproduceerbaar probleem in Dummy OS EMS.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Vermeld geen tokens, wachtwoorden of andere geheime gegevens.

  - type: input
    id: version
    attributes:
      label: Dummy OS EMS-versie
      placeholder: v0.0.1-alpha.4
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant-versie
      placeholder: 2026.7.x
    validations:
      required: true

  - type: dropdown
    id: simulation
    attributes:
      label: Simulatiemodus
      options:
        - Aan
        - Uit
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Probleem
      description: Wat ging er mis?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Stappen om te reproduceren
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevante logs
      description: Verwijder gevoelige gegevens.
      render: text
