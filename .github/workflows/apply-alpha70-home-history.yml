name: Apply alpha70 home history

on:
  push:
    branches:
      - feature-alpha70-home-history
    paths:
      - '.github/workflows/apply-alpha70-home-history.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-alpha70-home-history
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply persistent quarter-hour history integration
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import json

          coordinator = Path('custom_components/anker_ems/coordinator.py')
          text = coordinator.read_text()
          old = 'from .source_monitor import AnkerEmsSourceMonitor\nfrom .energy_need import build_energy_need_analysis\n'
          new = 'from .source_monitor import AnkerEmsSourceMonitor\nfrom .home_history import AnkerEmsHomeHistory\nfrom .energy_need import build_energy_need_analysis\n'
          if old not in text:
              raise SystemExit('coordinator import anchor missing')
          text = text.replace(old, new, 1)
          old = '        self.source_monitor = source_monitor\n        self._cached_72h_plan: dict[str, Any] | None = None\n'
          new = '        self.source_monitor = source_monitor\n        self.home_history = AnkerEmsHomeHistory(hass, entry.entry_id)\n        self._cached_72h_plan: dict[str, Any] | None = None\n'
          if old not in text:
              raise SystemExit('coordinator init anchor missing')
          text = text.replace(old, new, 1)
          old = '        data.update(self._home_power_snapshot())\n        if self._price_architecture_settings()["enabled"]:\n'
          new = '''        data.update(self._home_power_snapshot())\n        # Alpha70: build a persistent, EMS-owned 15-minute demand history from\n        # the validated canonical Home Power. This remains parallel/shadow data\n        # and does not feed the current Home Forecast or Plan72 yet.\n        data.update(\n            await self.home_history.async_observe(\n                data.get("home_power_w") if data.get("home_power_valid") else None\n            )\n        )\n        if self._price_architecture_settings()["enabled"]:\n'''
          if old not in text:
              raise SystemExit('coordinator observe anchor missing')
          coordinator.write_text(text.replace(old, new, 1))

          init = Path('custom_components/anker_ems/__init__.py')
          text = init.read_text()
          old = '    physical_test.attach_coordinator(coordinator)\n    execution.attach_coordinator(coordinator)\n    await coordinator.async_config_entry_first_refresh()\n'
          new = '''    physical_test.attach_coordinator(coordinator)\n    execution.attach_coordinator(coordinator)\n    await coordinator.home_history.async_load()\n    await coordinator.async_config_entry_first_refresh()\n'''
          if old not in text:
              raise SystemExit('__init__ history load anchor missing')
          init.write_text(text.replace(old, new, 1))

          sensor = Path('custom_components/anker_ems/sensor.py')
          text = sensor.read_text()
          old = '''def _home_power_attrs(data: dict[str, Any]) -> dict[str, Any]:\n    return {\n        "valid": data.get("home_power_valid", False),\n        "status": data.get("home_power_status"),\n        "raw_power_w": data.get("home_power_raw_w"),\n        "formula": data.get("home_power_formula"),\n        "source_entities": data.get("home_power_source_entities", {}),\n        "source_values_w": data.get("home_power_source_values_w", {}),\n        "missing_sources": data.get("home_power_missing_sources", []),\n        "shadow_only": True,\n        "plan72_source": False,\n    }\n\n\n'''
          new = old + '''def _home_energy_15m_attrs(data: dict[str, Any]) -> dict[str, Any]:\n    return {\n        "status": data.get("home_energy_15m_status"),\n        "period_start": data.get("home_energy_15m_period_start"),\n        "coverage_percent": data.get("home_energy_15m_coverage_percent"),\n        "sample_count": data.get("home_energy_15m_sample_count"),\n        "interval_minutes": data.get("home_history_interval_minutes", 15),\n        "history_points": data.get("home_history_points", 0),\n        "history_days": data.get("home_history_days", 0),\n        "retention_days": data.get("home_history_retention_days"),\n        "shadow_only": True,\n        "plan72_source": False,\n        "forecast_source": False,\n    }\n\n\ndef _home_history_days_attrs(data: dict[str, Any]) -> dict[str, Any]:\n    return {\n        "history_points": data.get("home_history_points", 0),\n        "covered_quarters_80pct": data.get("home_history_covered_quarters", 0),\n        "retention_days": data.get("home_history_retention_days"),\n        "interval_minutes": data.get("home_history_interval_minutes", 15),\n        "max_sample_gap_seconds": data.get("home_history_max_sample_gap_seconds"),\n        "shadow_only": True,\n        "plan72_source": False,\n        "forecast_source": False,\n    }\n\n\n'''
          if old not in text:
              raise SystemExit('sensor attrs anchor missing')
          text = text.replace(old, new, 1)
          old = '''    AnkerEmsSensorDescription(\n        key="home_power",\n        name="DO EMS Home Power",\n        native_unit_of_measurement=UnitOfPower.WATT,\n        value_fn=lambda d: d.get("home_power_w"),\n        attrs_fn=_home_power_attrs,\n    ),\n'''
          new = old + '''    AnkerEmsSensorDescription(\n        key="home_energy_15m",\n        name="DO EMS Home Energy 15m",\n        native_unit_of_measurement=UnitOfEnergy.KILO_WATT_HOUR,\n        value_fn=lambda d: d.get("home_energy_15m_kwh"),\n        attrs_fn=_home_energy_15m_attrs,\n    ),\n    AnkerEmsSensorDescription(\n        key="home_history_days",\n        name="DO EMS Home History Days",\n        value_fn=lambda d: d.get("home_history_days", 0),\n        attrs_fn=_home_history_days_attrs,\n    ),\n'''
          if old not in text:
              raise SystemExit('sensor descriptions anchor missing')
          sensor.write_text(text.replace(old, new, 1))

          naming = Path('custom_components/anker_ems/entity_naming.py')
          text = naming.read_text()
          old = '''EXACT_ENTITY_IDS = {\n    ("sensor", "home_power"): "sensor.do_ems_home_power",\n}\n'''
          new = '''EXACT_ENTITY_IDS = {\n    ("sensor", "home_power"): "sensor.do_ems_home_power",\n    ("sensor", "home_energy_15m"): "sensor.do_ems_home_energy_15m",\n    ("sensor", "home_history_days"): "sensor.do_ems_home_history_days",\n}\n'''
          if old not in text:
              raise SystemExit('entity naming anchor missing')
          naming.write_text(text.replace(old, new, 1))

          const = Path('custom_components/anker_ems/const.py')
          text = const.read_text()
          if 'VERSION = "0.0.1-alpha.69"' not in text:
              raise SystemExit('alpha69 const version missing')
          const.write_text(text.replace('VERSION = "0.0.1-alpha.69"', 'VERSION = "0.0.1-alpha.70"', 1))

          manifest_path = Path('custom_components/anker_ems/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('version') != '0.0.1-alpha.69':
              raise SystemExit(f'unexpected manifest version: {manifest.get("version")}')
          manifest['version'] = '0.0.1-alpha.70'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')

          Path('RELEASE_NOTES_ALPHA70.md').write_text('''# Dummy OS EMS 0.0.1-alpha.70 - Internal Home History\n\n## Nieuw\n- Persistente EMS-eigen kwartierhistorie opgebouwd uit de gevalideerde `sensor.do_ems_home_power`.\n- Nieuwe canonieke entiteit `sensor.do_ems_home_energy_15m`: laatst voltooide kwartierenergie in kWh, inclusief dekking en samplediagnostiek.\n- Nieuwe diagnostische entiteit `sensor.do_ems_home_history_days`: aantal lokale kalenderdagen dat in de interne historie vertegenwoordigd is.\n- Historie wordt 42 dagen bewaard om meerdere weekpatronen op te kunnen bouwen.\n- Meetgaten langer dan 120 seconden worden niet als verbruik ingevuld; dekking per kwartier blijft daardoor controleerbaar.\n\n## Naamgevingscontract\nDe twee nieuwe entity-ID's zijn expliciet vastgelegd. Home Assistant mag deze namen niet automatisch vervangen of van een `dummy_os_ems_`-prefix voorzien.\n\n## Scope\nDeze historylaag draait parallel/shadow. De bestaande externe Home Forecast en Plan72 blijven volledig ongewijzigd. De interne EMS Home Forecast wordt pas in een volgende stap op deze historie gebouwd en eerst parallel gevalideerd.\n''')
          PY
          python -m compileall -q custom_components/anker_ems
          python - <<'PY'
          from pathlib import Path
          import json
          naming = Path('custom_components/anker_ems/entity_naming.py').read_text()
          coordinator = Path('custom_components/anker_ems/coordinator.py').read_text()
          sensor = Path('custom_components/anker_ems/sensor.py').read_text()
          init = Path('custom_components/anker_ems/__init__.py').read_text()
          assert '("sensor", "home_energy_15m"): "sensor.do_ems_home_energy_15m"' in naming
          assert '("sensor", "home_history_days"): "sensor.do_ems_home_history_days"' in naming
          assert 'await self.home_history.async_observe' in coordinator
          assert 'await coordinator.home_history.async_load()' in init
          assert 'key="home_energy_15m"' in sensor
          assert 'key="home_history_days"' in sensor
          assert 'VERSION = "0.0.1-alpha.70"' in Path('custom_components/anker_ems/const.py').read_text()
          assert json.loads(Path('custom_components/anker_ems/manifest.json').read_text())['version'] == '0.0.1-alpha.70'
          print('ALPHA70_HOME_HISTORY_VALIDATION_OK')
          PY
          find custom_components/anker_ems -type d -name __pycache__ -prune -exec rm -rf {} +
          git add custom_components/anker_ems/home_history.py custom_components/anker_ems/coordinator.py custom_components/anker_ems/__init__.py custom_components/anker_ems/sensor.py custom_components/anker_ems/entity_naming.py custom_components/anker_ems/const.py custom_components/anker_ems/manifest.json RELEASE_NOTES_ALPHA70.md
          git commit -m 'Build persistent EMS home history'
          git push origin HEAD:feature-alpha70-home-history
