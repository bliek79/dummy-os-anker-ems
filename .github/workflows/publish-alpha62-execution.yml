name: Publish alpha62 execution

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha62-execution.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish exact alpha62 execution.py
        shell: bash
        run: |
          cat > /tmp/execution.py.gz.b64 <<'EOF'


EOF
          tr -d '\n' < /tmp/execution.py.gz.b64 | base64 --decode | gzip --decompress > custom_components/anker_ems/execution.py
          python -m py_compile custom_components/anker_ems/execution.py
          test "$(sha256sum custom_components/anker_ems/execution.py | awk '{print $1}')" = "555f6ddb6a44681a5da9bc089003a3aac6ee1115e2c38441ef8a70ce85a6b593"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/anker_ems/execution.py
          git rm .github/workflows/publish-alpha62-execution.yml
          git commit -m "Release 0.0.1-alpha.62: publish execution energy fidelity hotfix"
          git push origin HEAD:main
