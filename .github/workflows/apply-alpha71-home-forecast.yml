          text = coordinator.read_text()
          old = 'from .home_history import AnkerEmsHomeHistory\nfrom .energy_need import build_energy_need_analysis\n'
          new = 'from .home_history import AnkerEmsHomeHistory\nfrom .home_forecast import build_internal_home_forecast\nfrom .energy_need import build_energy_need_analysis\n'
          if old not in text:
              raise SystemExit('coordinator import anchor missing')
          text = text.replace(old, new, 1)
          old = '        self.home_history = AnkerEmsHomeHistory(hass, entry.entry_id)\n        self._cached_72h_plan: dict[str, Any] | None = None\n'
          new = '''        self.home_history = AnkerEmsHomeHistory(hass, entry.entry_id)\n        self._cached_internal_home_forecast: dict[str, Any] | None = None\n        self._internal_home_forecast_history_points = -1\n        self._cached_72h_plan: dict[str, Any] | None = None\n'''
          if old not in text:
              raise SystemExit('coordinator cache anchor missing')
          text = text.replace(old, new, 1)
          old = '''        data.update(\n            await self.home_history.async_observe(\n                data.get("home_power_w") if data.get("home_power_valid") else None\n            )\n        )\n        if self._price_architecture_settings()["enabled"]:\n'''
          new = '''        data.update(\n            await self.home_history.async_observe(\n                data.get("home_power_w") if data.get("home_power_valid") else None\n            )\n        )\n        # Alpha71: rebuild only when a completed 15-minute history point changes.\n        # The internal forecast remains shadow-only and is not used by Plan72.\n        history_points = int(data.get("home_history_points") or 0)\n        if (\n            self._cached_internal_home_forecast is None\n            or history_points != self._internal_home_forecast_history_points\n        ):\n            self._cached_internal_home_forecast = build_internal_home_forecast(\n                self.home_history.history\n            )\n            self._internal_home_forecast_history_points = history_points\n        data.update(deepcopy(self._cached_internal_home_forecast))\n        if self._price_architecture_settings()["enabled"]:\n'''
          if old not in text:
              raise SystemExit('coordinator forecast insertion anchor missing')
          coordinator.write_text(text.replace(old, new, 1))

          sensor = Path('custom_components/anker_ems/sensor.py')
          text = sensor.read_text()
          old = '''def _home_history_days_attrs(data: dict[str, Any]) -> dict[str, Any]:\n    return {\n        "history_points": data.get("home_history_points", 0),\n        "covered_quarters_80pct": data.get("home_history_covered_quarters", 0),\n        "retention_days": data.get("home_history_retention_days"),\n        "interval_minutes": data.get("home_history_interval_minutes", 15),\n        "max_sample_gap_seconds": data.get("home_history_max_sample_gap_seconds"),\n        "shadow_only": True,\n        "plan72_source": False,\n        "forecast_source": False,\n    }\n\n\n'''
          new = old + '''def _internal_home_forecast_attrs(data: dict[str, Any]) -> dict[str, Any]:\n    return {\n        "status": data.get("internal_home_forecast_status"),\n        "generated_at": data.get("internal_home_forecast_generated_at"),\n        "horizon_hours": data.get("internal_home_forecast_horizon_hours", 72),\n        "resolution_minutes": data.get("internal_home_forecast_resolution_minutes", 15),\n        "history_days": data.get("internal_home_forecast_history_days", 0),\n        "history_points": data.get("internal_home_forecast_history_points", 0),\n        "coverage_percent": data.get("internal_home_forecast_coverage_percent", 0),\n        "confidence_percent": data.get("internal_home_forecast_confidence_percent", 0),\n        "pattern_coverage_percent": data.get("internal_home_forecast_pattern_coverage_percent", 0),\n        "direct_pattern_quarters": data.get("internal_home_forecast_direct_pattern_quarters", 0),\n        "fallback_quarters": data.get("internal_home_forecast_fallback_quarters", 0),\n        "model": data.get("internal_home_forecast_model"),\n        "forecasts": data.get("internal_home_forecast_forecasts", []),\n        "hourly_forecast": data.get("internal_home_forecast_hourly", []),\n        "shadow_only": True,\n        "plan72_source": False,\n    }\n\n\ndef _internal_home_forecast_quality_attrs(data: dict[str, Any]) -> dict[str, Any]:\n    return {\n        "status": data.get("internal_home_forecast_status"),\n        "history_days": data.get("internal_home_forecast_history_days", 0),\n        "history_points": data.get("internal_home_forecast_history_points", 0),\n        "pattern_coverage_percent": data.get("internal_home_forecast_pattern_coverage_percent", 0),\n        "min_source_coverage_percent": data.get("internal_home_forecast_min_source_coverage_percent"),\n        "min_ready_history_days": data.get("internal_home_forecast_min_ready_history_days"),\n        "model": data.get("internal_home_forecast_model"),\n  