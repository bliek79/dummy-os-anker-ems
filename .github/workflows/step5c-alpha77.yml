name: Dummy OS EMS Alpha79 Self-Consumption Planner CI and Release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Compile integration and tests
        run: python -m compileall -q custom_components/anker_ems tests
      - name: Run full test suite
        run: python -m pytest -q tests
      - name: Validate Alpha79 contracts
        run: |
          grep -F 'VERSION = "0.0.1-alpha.79"' custom_components/anker_ems/const.py
          grep -F '"version": "0.0.1-alpha.79"' custom_components/anker_ems/manifest.json
          grep -F 'class AnkerEmsLegacyAuthorityFence' custom_components/anker_ems/authority_fence.py
          grep -F 'authority_fence.async_call(' custom_components/anker_ems/execution.py
          grep -F 'if armed and not self.authority_fence.is_open' custom_components/anker_ems/coordinator.py
          grep -F 'def _auto_bridge_status_attrs' custom_components/anker_ems/sensor.py
          grep -F 'def _auto_bridge_candidate_attrs' custom_components/anker_ems/sensor.py
          grep -F 'def _auto_bridge_slots_attrs' custom_components/anker_ems/sensor.py
          ! grep -F 'attrs_fn=_auto_bridge_attrs' custom_components/anker_ems/sensor.py
          test -f tests/test_alpha78_bridge_recorder_payload.py
          test -f tests/test_alpha79_self_consumption_policy.py
          grep -F 'energy_need_reserve_enforceable_in_self_consumption' custom_components/anker_ems/energy_need.py
          grep -F 'planner_preview_support_charge_hours' custom_components/anker_ems/planner_preview.py
          grep -F 'charge_from_grid_support_kwh' custom_components/anker_ems/planner_72h.py
          grep -F 'zelfconsumptie_bijladen' custom_components/anker_ems/planner_action_bridge.py
          test -f RELEASE_NOTES_ALPHA79.md

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release archive
        run: |
          zip -r dummy-os-anker-ems-alpha79.zip custom_components/anker_ems README.md LICENSE services.yaml 2>/dev/null ||             zip -r dummy-os-anker-ems-alpha79.zip custom_components/anker_ems README.md LICENSE
          sha256sum dummy-os-anker-ems-alpha79.zip > SHA256SUMS-alpha79.txt
          cat SHA256SUMS-alpha79.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.0.1-alpha.79 >/dev/null 2>&1; then
            gh release edit 0.0.1-alpha.79               --title "Dummy OS EMS 0.0.1-alpha.79 - Physical Self-Consumption Planner"               --notes-file RELEASE_NOTES_ALPHA79.md               --prerelease
            gh release upload 0.0.1-alpha.79 dummy-os-anker-ems-alpha79.zip SHA256SUMS-alpha79.txt --clobber
          else
            gh release create 0.0.1-alpha.79 dummy-os-anker-ems-alpha79.zip SHA256SUMS-alpha79.txt               --target main               --title "Dummy OS EMS 0.0.1-alpha.79 - Physical Self-Consumption Planner"               --notes-file RELEASE_NOTES_ALPHA79.md               --prerelease
          fi
