name: Dummy OS EMS Alpha81 Multi-rate Planner Runtime CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Compile integration and tests
        run: python -m compileall -q custom_components/anker_ems tests
      - name: Run full test suite
        run: python -m pytest -q tests
      - name: Validate Alpha81 contracts
        run: |
          grep -F 'VERSION = "0.0.1-alpha.81"' custom_components/anker_ems/const.py
          grep -F '"version": "0.0.1-alpha.81"' custom_components/anker_ems/manifest.json
          grep -F 'MULTIRATE_RUNTIME_VERSION = "alpha81_multirate_runtime_v1"' custom_components/anker_ems/planner_multirate.py
          grep -F 'PLANNER_POLICY_VERSION = "alpha80_cheapest_energy_safety_v1"' custom_components/anker_ems/planner_multirate.py
          grep -F 'async_add_executor_job' custom_components/anker_ems/coordinator.py
          grep -F '"native_quarter_plus_events"' custom_components/anker_ems/coordinator.py
          ! grep -F 'build_energy_need_analysis(' custom_components/anker_ems/coordinator.py
          ! grep -F 'build_planner_preview(' custom_components/anker_ems/coordinator.py
          ! grep -F 'build_72h_plan_preview(' custom_components/anker_ems/coordinator.py
          printf '%s  %s\n' '9d7dd824a0f9e5cb3835705326b4037b1ef45e9b549a17d138bb859cd99e9864' 'custom_components/anker_ems/energy_need.py' | sha256sum -c -
          printf '%s  %s\n' 'f7f453c6f48dd72514604e2367c69cdefc4fdadad6c7004d5f38647aecb3eb38' 'custom_components/anker_ems/planner_preview.py' | sha256sum -c -
          printf '%s  %s\n' '71f6247a898ec8c1ffcf765534c83d485c6386fe8ccbdfcc465efa75c632be34' 'custom_components/anker_ems/planner_72h.py' | sha256sum -c -
          test -f tests/test_alpha80_cheapest_energy_safety.py
          test -f tests/test_alpha81_multirate_runtime.py
          test -f RELEASE_NOTES_ALPHA81.md
          grep -F 'class AnkerEmsLegacyAuthorityFence' custom_components/anker_ems/authority_fence.py
          grep -F 'authority_fence.async_call(' custom_components/anker_ems/execution.py
          grep -F 'if armed and not self.authority_fence.is_open' custom_components/anker_ems/coordinator.py
          ! grep -R -F 'zelfconsumptie_bijladen' custom_components/anker_ems
          ! grep -R -F 'charge_from_grid_support_kwh' custom_components/anker_ems

  # Deliberately no publish job.
  # Alpha81 merge/release remains a separate explicit user gate.
