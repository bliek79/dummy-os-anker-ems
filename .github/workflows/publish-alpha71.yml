name: Publish alpha71 prerelease

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-alpha71.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: 62ffa80164dc57648782fa22278bdad023feacd0
          fetch-depth: 0

      - name: Build release archive and checksum
        shell: bash
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
          zip -r dist/dummy-os-anker-ems-alpha71.zip custom_components/anker_ems -x '*/__pycache__/*' '*.pyc'
          cd dist
          sha256sum dummy-os-anker-ems-alpha71.zip > SHA256SUMS-alpha71.txt
          cat SHA256SUMS-alpha71.txt

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG='0.0.1-alpha.71'
          TITLE='Dummy OS EMS 0.0.1-alpha.71 - Parallel Internal Home Forecast'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --target 62ffa80164dc57648782fa22278bdad023feacd0 \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES_ALPHA71.md \
            --prerelease \
            dist/dummy-os-anker-ems-alpha71.zip \
            dist/SHA256SUMS-alpha71.txt
