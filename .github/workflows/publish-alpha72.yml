name: Publish alpha72

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'bliek79/dummy-os-anker-ems'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/anker_ems/manifest.json').read_text())
          expected = '0.0.1-alpha.72'
          if manifest.get('version') != expected:
              raise SystemExit(f"Expected {expected}, got {manifest.get('version')}")
          PY

      - name: Build EMS ZIP and checksum
        run: |
          zip -r dummy-os-anker-ems-alpha72.zip custom_components/anker_ems
          sha256sum dummy-os-anker-ems-alpha72.zip > SHA256SUMS-alpha72.txt

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES_ALPHA72.md <<'EOF'
          ## Dummy OS EMS 0.0.1-alpha.72 - Live Home Forecast Diagnostics

          ### Nieuw
          - interne Home Forecast blijft parallel leren op de EMS-eigen 15-minuten historie;
          - persistente forward-looking forecast-versus-actual evaluatie met 42 dagen retentie;
          - externe versus interne Home Forecast shadow-vergelijking op volledige klokuren;
          - planner-adapter voorkomt 73 gedeeltelijke klokuren en accepteert alleen volledige uren met 4 kwartierpunten;
          - readiness/transition-laag met learning, shadow, candidate en leading_ready;
          - voorbereiding op strikt gescheiden normal/absence-profielen zonder een afwezigheidsentity te gokken;
          - drie nieuwe live diagnostische sensoren:
            - sensor.do_ems_home_forecast_evaluation
            - sensor.do_ems_home_forecast_comparison
            - sensor.do_ems_home_forecast_transition
          - dashboarddata voorbereid voor externe forecast, interne forecast, afwijking, MAE, bias en totalen.

          ### Veiligheid en gedrag
          - de externe Home Forecast blijft de actieve bron;
          - de interne forecast blijft shadow-only;
          - Energy Need gebruikt nog steeds de bestaande actieve forecastbron;
          - Plan72 is niet overgeschakeld naar de interne forecast;
          - geen wijziging aan plan-write, scheduler of fysieke uitvoering;
          - geen automatische bronwissel.

          ### Validatie
          - PR #15: HACS success;
          - PR #15: Hassfest success;
          - live functionele validatie volgt na installatie in Home Assistant.

          ### Installatiecontrole
          Controleer na installatie en herstart dat de drie nieuwe DO EMS-sensoren bestaan en dat de comparison/evaluation/transition-attributen live worden gevuld. De actieve planner moet dezelfde externe Home Forecast blijven gebruiken.
          EOF

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 0.0.1-alpha.72 \
            dummy-os-anker-ems-alpha72.zip \
            SHA256SUMS-alpha72.txt \
            --target "$GITHUB_SHA" \
            --title "Dummy OS EMS 0.0.1-alpha.72 - Live Home Forecast Diagnostics" \
            --notes-file RELEASE_NOTES_ALPHA72.md \
            --prerelease
