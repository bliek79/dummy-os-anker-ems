name: Publish alpha63 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha63.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: 0.0.1-alpha.63
      TARGET_SHA: c956df9faf7317c4bfba88c6f7de34f4fdc6a0db
      RELEASE_TITLE: Dummy OS EMS 0.0.1-alpha.63 - Startup Recovery Hotfix
      ZIP_NAME: dummy-os-anker-ems-alpha63.zip
      SUM_NAME: SHA256SUMS-alpha63.txt
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$TARGET_SHA")" = "$TARGET_SHA"
          git show "$TARGET_SHA:custom_components/anker_ems/manifest.json" | grep -F '"version": "0.0.1-alpha.63"'
          git show "$TARGET_SHA:RELEASE_NOTES_ALPHA63.md" >/dev/null
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists locally/remotely"
            exit 1
          fi

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$ZIP_NAME" "$TARGET_SHA" custom_components/anker_ems
          sha256sum "$ZIP_NAME" > "$SUM_NAME"
          unzip -t "$ZIP_NAME"

      - name: Create tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "$RELEASE_TITLE"
          git push origin "$TAG"
          if ! gh release create "$TAG" "$ZIP_NAME" "$SUM_NAME" \
            --verify-tag \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES_ALPHA63.md \
            --prerelease; then
            git push --delete origin "$TAG" || true
            exit 1
          fi

      - name: Remove temporary publish workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          if test -f .github/workflows/publish-alpha63.yml; then
            git rm .github/workflows/publish-alpha63.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove temporary alpha63 publish workflow"
            git push origin main
          fi
