name: Publish alpha70 prerelease

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-alpha70.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: 6682475826403706fe81273c08cc854297ecb6ee
          fetch-depth: 0

      - name: Build release archive and checksum
        shell: bash
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
          zip -r dist/dummy-os-anker-ems-alpha70.zip custom_components/anker_ems -x '*/__pycache__/*' '*.pyc'
          cd dist
          sha256sum dummy-os-anker-ems-alpha70.zip > SHA256SUMS-alpha70.txt
          cat SHA256SUMS-alpha70.txt

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG='0.0.1-alpha.70'
          TITLE='Dummy OS EMS 0.0.1-alpha.70 - Internal Home History'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --target 6682475826403706fe81273c08cc854297ecb6ee \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES_ALPHA70.md \
            --prerelease \
            dist/dummy-os-anker-ems-alpha70.zip \
            dist/SHA256SUMS-alpha70.txt
