name: Publish Alpha82 Dynamic Charge Limit and Emergency Acknowledge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-alpha82.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile shipped code
        run: python -m compileall -q custom_components/anker_ems tests
      - name: Full regression tests including executable alpha82 controller methods
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify version and safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('custom_components/anker_ems')
          const = (root/'const.py').read_text()
          manifest = json.loads((root/'manifest.json').read_text())
          assert manifest['version'] == '0.0.1-alpha.82'
          assert re.search(r'^VERSION = "0\.0\.1-alpha\.82"$', const, re.M)
          assert '"button"' in const
          assert 'SERVICE_RESET_EXECUTION_STATUS' in const
          assert (root/'charge_power_limit.py').exists()
          assert (root/'execution_status_reset.py').exists()
          assert Path('RELEASE_NOTES_ALPHA82.md').exists()
          PY
      - name: Build and byte-verify Home Assistant install archive
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('custom_components/anker_ems')
          sources = sorted(p for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc')
          output = Path('dist/Dummy_OS_EMS_0.0.1-alpha.82_HA_install.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as z:
              for file in sources: z.write(file, file.relative_to(root.parent))
          with zipfile.ZipFile(output) as z:
              for file in sources: assert z.read(str(file.relative_to(root.parent))) == file.read_bytes()
              assert all('__pycache__' not in n and not n.endswith('.pyc') for n in z.namelist())
          PY
          sha256sum dist/*.zip | sed 's#dist/##' > dist/SHA256SUMS-alpha82.txt
      - name: Publish alpha82 prerelease
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh release create 0.0.1-alpha.82 dist/*.zip dist/SHA256SUMS-alpha82.txt \
            --title 'Dummy OS EMS 0.0.1-alpha.82 - Dynamic battery limits and emergency reset' \
            --notes-file RELEASE_NOTES_ALPHA82.md --prerelease --target "$GITHUB_SHA"
