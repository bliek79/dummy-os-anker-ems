name: Finalize alpha62

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-alpha62.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct, verify, clean and publish alpha62
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat .alpha62-final/execution.00 .alpha62-final/execution.01 .alpha62-final/execution.02 .alpha62-final/execution.03 | base64 --decode | gzip --decompress > custom_components/anker_ems/execution.py
          cat .alpha62-final/bridge.00 .alpha62-final/bridge.01 | base64 --decode | gzip --decompress > custom_components/anker_ems/planner_action_bridge.py
          cat .alpha62-final/plan_store.00 | base64 --decode | gzip --decompress > custom_components/anker_ems/plan_store.py
          cat .alpha62-final/scheduler.00 | base64 --decode | gzip --decompress > custom_components/anker_ems/scheduler.py

          test "$(sha256sum custom_components/anker_ems/execution.py | awk '{print $1}')" = "555f6ddb6a44681a5da9bc089003a3aac6ee1115e2c38441ef8a70ce85a6b593"
          test "$(sha256sum custom_components/anker_ems/planner_action_bridge.py | awk '{print $1}')" = "a157c12c463c8861a3d06b76479f0c4afa9a8a7206011f7a15676281ef8fae8d"
          test "$(sha256sum custom_components/anker_ems/plan_store.py | awk '{print $1}')" = "01db39c0ca9ef26c1a4bb767119e5a0d4a5693965f3e93a7f0d5194af88eb8ca"
          test "$(sha256sum custom_components/anker_ems/scheduler.py | awk '{print $1}')" = "d8b05058215667e33f721e2a3ee362318e9bd2ccfdbdddfcb5253422e500faf7"
          test "$(sha256sum custom_components/anker_ems/manifest.json | awk '{print $1}')" = "094415004435fce71847bfc36fa7ceb82f6d6874f910685c824f6bc571584009"
          test "$(sha256sum RELEASE_NOTES_ALPHA62.md | awk '{print $1}')" = "5978fd3b217181850b6bbb4a0f8cbc0256fb1ad740af9a1cd1c897a35935ba73"

          python -m compileall -q custom_components/anker_ems

          git rm -r --ignore-unmatch custom_components/anker_ems/__pycache__
          find custom_components/anker_ems -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/anker_ems -type f -name '*.pyc' -delete

          git rm -r --ignore-unmatch .alpha62-publish
          git rm -r --ignore-unmatch .alpha62-final
          git rm --ignore-unmatch .github/workflows/publish-alpha62-execution.yml
          git rm --ignore-unmatch .github/workflows/publish-alpha62-execution-v2.yml
          git rm --ignore-unmatch .github/workflows/finalize-alpha62.yml

          git add custom_components/anker_ems/execution.py \
                  custom_components/anker_ems/planner_action_bridge.py \
                  custom_components/anker_ems/plan_store.py \
                  custom_components/anker_ems/scheduler.py \
                  custom_components/anker_ems/manifest.json \
                  RELEASE_NOTES_ALPHA62.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release 0.0.1-alpha.62: finalize energy fidelity hotfix"
          git push origin HEAD:main

          test -z "$(find custom_components/anker_ems -type d -name __pycache__ -print -quit)"
          test -z "$(find custom_components/anker_ems -type f -name '*.pyc' -print -quit)"

          rm -f dummy-os-anker-ems-alpha62.zip SHA256SUMS-alpha62.txt
          zip -qr dummy-os-anker-ems-alpha62.zip custom_components/anker_ems -x '*/__pycache__/*' '*.pyc'
          sha256sum dummy-os-anker-ems-alpha62.zip > SHA256SUMS-alpha62.txt

          if gh release view 0.0.1-alpha.62 >/dev/null 2>&1; then
            gh release delete 0.0.1-alpha.62 --yes --cleanup-tag
          fi

          gh release create 0.0.1-alpha.62 \
            dummy-os-anker-ems-alpha62.zip \
            SHA256SUMS-alpha62.txt \
            --target "$(git rev-parse HEAD)" \
            --title "Dummy OS EMS 0.0.1-alpha.62 - Plan72 Execution Energy Fidelity Hotfix" \
            --notes-file RELEASE_NOTES_ALPHA62.md \
            --prerelease
