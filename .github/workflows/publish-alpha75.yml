name: Publish alpha75 prerelease

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha75.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: 0.0.1-alpha.75
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Dummy OS EMS 0.0.1-alpha.75" \
            --notes-file RELEASE_NOTES_ALPHA75.md \
            --prerelease
