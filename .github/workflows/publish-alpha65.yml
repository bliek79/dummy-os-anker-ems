name: Publish alpha65 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-alpha65.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply alpha65 cleanup fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          plan = Path('custom_components/anker_ems/plan_store.py')
          text = plan.read_text()

          old = '''        def expired_automatic_pending(plan: dict[str, Any]) -> bool:\n            \"\"\"Return True when a planner-owned pending plan is past its start window.\"\"\"\n            if str(plan.get(\"origin\") or \"\") != \"automatic_72h_planner\":\n                return False\n            if str(plan.get(\"lifecycle_status\") or \"\").lower() != \"pending\":\n                return False\n            start_raw = plan.get(\"start_time\")\n            start = dt_util.parse_datetime(str(start_raw)) if start_raw else None\n            if start is None:\n                return False\n            if start.tzinfo is None:\n                start = start.replace(tzinfo=dt_util.DEFAULT_TIME_ZONE)\n            delay_raw = plan.get(\"max_start_delay_min\", 0)\n            try:\n                delay_min = max(0.0, float(delay_raw or 0))\n            except (TypeError, ValueError):\n                delay_min = 0.0\n            return dt_util.now() > start + timedelta(minutes=delay_min)\n'''

          new = old + '''\n        def expired_automatic_terminal(plan: dict[str, Any]) -> bool:\n            \"\"\"Return True when a planner-owned terminal plan is past its start window.\"\"\"\n            if str(plan.get(\"origin\") or \"\") != \"automatic_72h_planner\":\n                return False\n            if str(plan.get(\"lifecycle_status\") or \"\").lower() not in {\"geannuleerd\", \"voltooid\", \"fout\"}:\n                return False\n            start_raw = plan.get(\"start_time\")\n            start = dt_util.parse_datetime(str(start_raw)) if start_raw else None\n            if start is None:\n                return False\n            if start.tzinfo is None:\n                start = start.replace(tzinfo=dt_util.DEFAULT_TIME_ZONE)\n            delay_raw = plan.get(\"max_start_delay_min\", 0)\n            try:\n                delay_min = max(0.0, float(delay_raw or 0))\n            except (TypeError, ValueError):\n                delay_min = 0.0\n            return dt_util.now() > start + timedelta(minutes=delay_min)\n'''

          if old not in text:
              raise SystemExit('alpha65 anchor 1 not found')
          text = text.replace(old, new, 1)

          old2 = '''                    current_lifecycle == \"concept\"\n                    or pending_revisable(current)\n                    or expired_automatic_pending(current)\n'''
          new2 = '''                    current_lifecycle == \"concept\"\n                    or pending_revisable(current)\n                    or expired_automatic_pending(current)\n                    or expired_automatic_terminal(current)\n'''
          if old2 not in text:
              raise SystemExit('alpha65 anchor 2 not found')
          text = text.replace(old2, new2, 1)

          old3 = '''                    empty[\"lifecycle_reason\"] = (\n                        \"automatic_expired_released\"\n                        if expired_automatic_pending(current)\n                        else \"automatic_preview_cleared\"\n                    )\n'''
          new3 = '''                    if expired_automatic_pending(current):\n                        clear_reason = \"automatic_expired_released\"\n                    elif expired_automatic_terminal(current):\n                        clear_reason = \"automatic_terminal_released\"\n                    else:\n                        clear_reason = \"automatic_preview_cleared\"\n                    empty[\"lifecycle_reason\"] = clear_reason\n'''
          if old3 not in text:
              raise SystemExit('alpha65 anchor 3 not found')
          text = text.replace(old3, new3, 1)
          plan.write_text(text)

          const = Path('custom_components/anker_ems/const.py')
          c = const.read_text()
          c = c.replace('VERSION = \"0.0.1-alpha.63\"', 'VERSION = \"0.0.1-alpha.65\"', 1)
          const.write_text(c)

          manifest = Path('custom_components/anker_ems/manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '0.0.1-alpha.65'
          manifest.write_text(json.dumps(data, indent=2) + '\n')

          notes = Path('RELEASE_NOTES_ALPHA65.md')
          notes.write_text('''# Dummy OS EMS 0.0.1-alpha.65 - Terminal Plan Slot Cleanup Hotfix\n\n## Samenvatting\nAlpha65 ruimt verlopen automatische planner-slots met een terminale lifecycle-status automatisch op, zodat oude acties niet zichtbaar blijven hangen terwijl ze technisch al herbruikbaar zijn.\n\n## Opgelost\n- Planner-owned slots met `fout`, `voltooid` of `geannuleerd` worden na het volledige startvenster teruggezet naar de standaard lege/conceptstatus wanneer er geen actuele planneractie voor dat slot is.\n- De cleanup geldt uitsluitend voor `origin: automatic_72h_planner`; handmatige plannen worden niet aangeraakt.\n- De execution audit/historie blijft intact; alleen de actieve Plan Store-slotinhoud wordt opgeschoond.\n- De lifecycle-reason voor deze cleanup is `automatic_terminal_released`.\n- De interne `VERSION` in `const.py` is gelijkgetrokken met de releaseversie.\n\n## Ongewijzigd\n- Alpha64 Plan72 SOC-startuprecovery blijft ongewijzigd.\n- Alpha62 planned-energy execution en prijsvensterbegrenzing blijven ongewijzigd.\n- Alpha61 low-SOC safety recovery blijft ongewijzigd.\n- Manual plans, Automatic Execution-arm, safety gates en safe-return blijven ongewijzigd.\n\n## Validatie\n- Python compileall moet slagen voor `custom_components/anker_ems`.\n- De broncontrole moet bevestigen dat alleen automatische terminale slots buiten hun startvenster worden geleegd.\n- Live Home Assistant-validatie blijft vereist om te bevestigen dat het bestaande oude `fout`-slot na de eerstvolgende coordinator/sync-cyclus verdwijnt.\n''')
          PY

      - name: Validate source
        shell: bash
        run: |
          python -m compileall -q custom_components/anker_ems
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('custom_components/anker_ems/plan_store.py').read_text()
          assert 'expired_automatic_terminal' in p
          assert 'automatic_terminal_released' in p
          assert 'automatic_72h_planner' in p
          assert 'VERSION = "0.0.1-alpha.65"' in Path('custom_components/anker_ems/const.py').read_text()
          assert json.loads(Path('custom_components/anker_ems/manifest.json').read_text())['version'] == '0.0.1-alpha.65'
          print('ALPHA65_SOURCE_VALIDATION_OK')
          PY
          find custom_components/anker_ems -type d -name __pycache__ -prune -exec rm -rf {} +
          if find custom_components/anker_ems -type f \( -name '*.pyc' -o -name '*.pyo' \) | grep -q .; then exit 1; fi

      - name: Commit alpha65 source
        id: source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/anker_ems/plan_store.py custom_components/anker_ems/const.py custom_components/anker_ems/manifest.json RELEASE_NOTES_ALPHA65.md
          git commit -m 'Release 0.0.1-alpha.65: terminal plan slot cleanup hotfix'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        shell: bash
        run: |
          SOURCE_SHA='${{ steps.source.outputs.sha }}'
          git archive --format=zip --output=dummy-os-anker-ems-alpha65.zip "$SOURCE_SHA" custom_components/anker_ems
          sha256sum dummy-os-anker-ems-alpha65.zip > SHA256SUMS-alpha65.txt
          unzip -l dummy-os-anker-ems-alpha65.zip

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          SOURCE_SHA='${{ steps.source.outputs.sha }}'
          git tag -a 0.0.1-alpha.65 "$SOURCE_SHA" -m 'Dummy OS EMS 0.0.1-alpha.65 - Terminal Plan Slot Cleanup Hotfix'
          git push origin refs/tags/0.0.1-alpha.65
          gh release create 0.0.1-alpha.65 \
            dummy-os-anker-ems-alpha65.zip SHA256SUMS-alpha65.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Dummy OS EMS 0.0.1-alpha.65 - Terminal Plan Slot Cleanup Hotfix' \
            --notes-file RELEASE_NOTES_ALPHA65.md \
            --prerelease \
            --target "$SOURCE_SHA"

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-alpha65.yml
          git commit -m 'Remove temporary alpha65 publishing workflow'
          git push origin HEAD:main
